<div class="min-h-screen bg-base-200 p-6">
  @let product = productResource.value();

  <!-- LOADING -->
  @if (productResource.isLoading()) {
    <div class="flex justify-center items-center h-96">
      <span class="loading loading-spinner loading-lg text-accent"></span>
    </div>
  }

  <!-- ERROR -->
  @else if (productResource.error()) {
    <div class="alert alert-error shadow-lg">
      <span>El producto no existe</span>
    </div>
  }

  <!-- CONTENT -->
  @else if (product) {
    <div class="max-w-6xl mx-auto">
      <!-- CARD PRINCIPAL -->
      <div class="card bg-base-100 shadow-xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-10 p-8">
          <!-- CAROUSEL -->
          <div class="flex justify-center items-center">
            <div
              class="w-full max-w-md rounded-2xl overflow-hidden shadow-lg border border-base-300"
            >
              <product-carousel [images]="product.images" />
            </div>
          </div>

          <!-- INFO -->
          <div class="flex flex-col justify-center gap-6">
            <!-- TITLE -->
            <h1 class="text-4xl font-bold text-base-content leading-tight">
              {{ product.title }}
            </h1>

            <!-- DESCRIPTION -->
            <p class="text-base-content/70 text-lg leading-relaxed">
              {{ product.description }}
            </p>

            <!-- PRICE -->
            <div class="flex items-end gap-2">
              <span class="text-sm opacity-60">Precio</span>
              <span class="text-5xl font-black text-accent"> ${{ product.price }} </span>
            </div>

            <!-- ACTIONS -->
            <div class="pt-6 flex gap-3">
              <a [routerLink]="['/']" class="btn btn-outline btn-accent"> ← Volver </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
