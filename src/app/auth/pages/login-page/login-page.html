<form
  class="flex flex-col gap-4 p-6 bg-white rounded-lg shadow-lg"
  [formGroup]="loginForm"
  (ngSubmit)="onSubmit()"
>
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Login</h1>

  <div class="space-y-1">
    <label class="input validator rounded-lg border-2 border-gray-200 hover:border-gray-300">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor"
        >
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </g>
      </svg>
      <input formControlName="email" type="email" placeholder="mail@site.com" required />
    </label>
    <div class="validator-hint hidden text-red-500 text-xs">Enter valid email address</div>
  </div>

  <div class="space-y-1">
    <label class="input validator rounded-lg border-2 border-gray-200 hover:border-gray-300">
      <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <g
          stroke-linejoin="round"
          stroke-linecap="round"
          stroke-width="2.5"
          fill="none"
          stroke="currentColor"
        >
          <path
            d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"
          ></path>
          <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
        </g>
      </svg>
      <input
        formControlName="password"
        type="password"
        required
        placeholder="Password"
        minlength="6"
      />
    </label>
  </div>

  <button type="submit" class="btn btn-secondary rounded-lg font-semibold mt-4">Login</button>
</form>

<div class="divider"></div>

<p class="text-slate-700 text-center">
  Don't have an account?
  <a routerLink="/auth/register" class="text-secondary font-semibold hover:underline"
    >create one here</a
  >
</p>

@if (hassError()) {
  <div role="alert" class="alert alert-error fade-in fixed bottom-5 right-5 w-52">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-6 w-6 shrink-0 stroke-current"
      fill="none"
      viewBox="0 0 24 24"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
      />
    </svg>
    <span>Please Verify the information entered.</span>
  </div>
}
